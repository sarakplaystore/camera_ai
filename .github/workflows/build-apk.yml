name: Build APK

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          SDKMGR=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "Using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Download pose model (bundled into the APK)
        run: |
          mkdir -p app/src/main/assets
          curl -fSL --retry 3 -o app/src/main/assets/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
          curl -fSL --retry 3 -o app/src/main/assets/pose_landmarker_full.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
          ls -la app/src/main/assets

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore app/keystore.p12 -storetype PKCS12 \
            -alias cameraai -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cameraai2026 -keypass cameraai2026 \
            -dname "CN=Camera AI, OU=Apps, O=Sarak, L=Kampot, C=KH"

      - name: Build release APK
        id: gradle
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Publish build log (for debugging)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo '```'
            grep -nE "^(e:|w: .*(error|Error))|FAILURE|What went wrong|> Task .* FAILED|error:|Caused by" build.log | head -200 || true
            echo '```'
            echo
            echo '```'
            grep -n -B2 -A12 "^e: \| error: " build.log | head -400 || true
            echo '```'
          } > issue-body.md
          NUM=$(gh issue list --repo "$GH_REPO" --search "BUILD FAILURES in:title" --state open --json number -q '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh issue create --repo "$GH_REPO" --title "BUILD FAILURES" --body-file issue-body.md
          else
            gh issue comment "$NUM" --repo "$GH_REPO" --body-file issue-body.md
          fi

      - name: Fail if gradle failed
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/camera-ai.apk
          ls -la out

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: camera-ai-apk
          path: out/camera-ai.apk
          retention-days: 90

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Camera AI v1.0.${{ github.run_number }}
          body: |
            Camera AI — people-triggered CCTV for Android.

            * Tracks people with MediaPipe BlazePose (on-device, no cloud)
            * Starts recording automatically when someone joins the frame
            * Every clip runs at least **10 minutes** (customisable in Settings)
            * Keeps rolling while people are in view, in the foreground or background

            Download `camera-ai.apk` below and install it (allow "install unknown apps").
          files: out/camera-ai.apk
          fail_on_unmatched_files: true
